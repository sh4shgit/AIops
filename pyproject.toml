[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiops-assistant"
version = "0.1.0"
description = "AI assistant that reduces alert noise for DevOps/SRE teams by attaching retrieved precedent to detected log anomalies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AIOps Team" }]

dependencies = [
    # API
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    # Queue
    "redis>=5.0,<6",
    # Detection
    "drain3>=0.9,<1",
    "scikit-learn>=1.4,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    # Retrieval / RAG
    "sentence-transformers>=3.0,<4",
    "chromadb>=0.5,<1",
    "langchain>=0.2,<1",
    "langchain-community>=0.2,<1",
    "langchain-chroma>=0.1,<1",
    # Reasoning
    "langchain-anthropic>=0.1,<1",
    "langgraph>=0.2,<1",
    # Actions
    "jira>=3.8,<4",
    "slack-sdk>=3.27,<4",
    # Observability
    "prometheus-client>=0.20,<1",
    "prometheus-fastapi-instrumentator>=7,<8",
    "structlog>=24.1,<26",
    # Utilities
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
    "locust>=2.25,<3",
    "fakeredis>=2.21,<3",
    "respx>=0.21,<1",
]
pgvector = [
    "pgvector>=0.2,<1",
    "psycopg2-binary>=2.9,<3",
    "sqlalchemy>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "load: Load tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aiops"]
